name: Public Profile Disclosure Guard

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disclosure-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject dangerous tracked filenames
        shell: bash
        run: |
          set -euo pipefail
          BAD="$(git ls-files | grep -Ei '(^|/)(\.env($|\.)|\.npmrc$|\.pypirc$|\.netrc$|id_rsa$|id_ed25519$|credentials(\.|$)|secrets(\.|$)|service-account.*\.json$)|\.(pem|key|p12|pfx|jks|keystore|ovpn|tfstate|tfvars)$' || true)"
          if [ -n "$BAD" ]; then
            echo '::error::Forbidden credential/state file is tracked.'
            printf '%s\n' "$BAD"
            exit 1
          fi

      - name: Scan tracked text for high-confidence secret patterns
        shell: python
        run: |
          import pathlib, re, subprocess, sys
          patterns = [
              re.compile(r"-----BEGIN(?: [A-Z0-9]+)? PRIVATE KEY-----"),
              re.compile(r"(?<![A-Za-z0-9])ghp_[A-Za-z0-9]{30,}"),
              re.compile(r"(?<![A-Za-z0-9])github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])"),
              re.compile(r"(?i)(?:api[_-]?key|client[_-]?secret|access[_-]?token|password)\s*[:=]\s*['\"][^'$<{\n][^'\"\n]{7,}['\"]"),
          ]
          failures=[]
          for name in subprocess.check_output(["git","ls-files"], text=True).splitlines():
              p=pathlib.Path(name)
              try: raw=p.read_bytes()
              except OSError: continue
              if b"\x00" in raw: continue
              text=raw.decode("utf-8",errors="ignore")
              if any(pat.search(text) for pat in patterns): failures.append(name)
          if failures:
              print("::error::Potential committed secret material detected.")
              for name in sorted(set(failures)): print(name)
              sys.exit(1)
          print("Tracked-text secret scan: PASS")

      - name: Guard summary
        run: |
          {
            echo '## Public Profile Disclosure Guard'
            echo '- Dangerous tracked filenames: PASS'
            echo '- High-confidence secret scan: PASS'
            echo '- Human disclosure review remains mandatory.'
          } >> "$GITHUB_STEP_SUMMARY"
